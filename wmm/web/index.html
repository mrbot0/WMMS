<!doctype html>

<head>
  <meta charset="utf-8">

  <title>Windows Maintenance Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6CBD'/%3E%3Cpath d='M8 9h7v7H8zM17 9h7v7h-7zM8 18h7v7H8zM17 18h7v7h-7z' fill='white'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before the first paint.
    try { var t = JSON.parse(localStorage.getItem("wmm.theme") || "null"); if (t && t !== "system") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    // Animation level (fx.js keeps it up to date): fun, subtle or off.
    try { var f = JSON.parse(localStorage.getItem("wmm.animations") || "null");
      document.documentElement.setAttribute("data-fx", f || (matchMedia("(prefers-reduced-motion: reduce)").matches ? "subtle" : "fun")); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/css/app.css">

    <div class="main">

        <button class="search-btn" id="btn-search" type="button" aria-label="Open command palette">

          <span class="label">Search or run a command</span><span class="kbd">Ctrl K</span>
        </button>
        <div class="topbar-meta" id="topbar-meta"></div>
        <div class="topbar-actions">
          <a class="live-mini" id="live-mini" href="#/performance" title="Live CPU and memory">CPU <b>–</b> RAM <b>–</b></a>
          <button class="icon-btn" id="btn-print" type="button" title="Print this page" aria-label="Print this page">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>

          </a>
          <button class="icon-btn" id="btn-theme" type="button" title="Toggle theme" aria-label="Toggle theme"></button>
          <button class="icon-btn" id="btn-notif" type="button" title="Notifications" aria-label="Notifications">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="count" id="notif-count" hidden>0</span>
          </button>
          <button class="icon-btn icon-btn-danger" id="btn-power" type="button" title="Stop Windows Maintenance Manager (administrator)"
            aria-label="Stop Windows Maintenance Manager" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v9M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>
          </button>
          <button class="btn" id="btn-activity" type="button" title="Show activity">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Activity <span class="dot" id="activity-dot" hidden></span>
          </button>
          <button class="btn btn-primary" id="btn-scan" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Scan all
          </button>
        </div>
        <div class="top-progress" id="top-progress" aria-hidden="true"><div></div></div>
      </header>
      <div class="main-scroll" id="scroller">
        <div id="banner"></div>
        <main id="content" class="content" tabindex="-1"></main>
      </div>
      <footer class="statusbar" id="statusbar" aria-label="Status"></footer>
    </div>
  </div>
  <div class="popover" id="notif-panel" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Activity" hidden>
    <div class="drawer-head">
      <h2>Activity</h2>
      <button class="btn btn-ghost" id="drawer-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
  <button class="to-top" id="to-top" type="button" title="Back to top" aria-label="Back to top" hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
