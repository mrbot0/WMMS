name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and API tests
        run: python -m unittest discover -s tests -t . -v
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem wmm/web/js -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $($_.FullName)" }
          }
      - name: Italian dictionaries are valid JSON
        run: python -c "import json,pathlib; [json.loads(pathlib.Path(f).read_text(encoding='utf-8').split(' = ',1)[1].rstrip().rstrip(';')) for f in ('wmm/web/js/i18n_pages.js','wmm/web/js/i18n_tools.js')]"
