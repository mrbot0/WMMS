# Builds the program package for the in-app updater: push a tag such as v2.2.0 and this workflow tests the code,
# builds the zip, SHA256SUMS.txt and the notes (tools/build_release.py) and publishes a GitHub release with them.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the program version
        shell: pwsh
        run: |
          $version = python -c "import wmm; print(wmm.VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $version" }

      - name: Run the tests
        run: python -m unittest discover -s tests -t .

      - name: Build the package, its checksum and the notes
        run: python tools/build_release.py release

      # The signed setup and the winget manifests (tools/build_installer.ps1). Signing uses two repository secrets:
      # WMM_SIGN_PFX_BASE64 (the .pfx code-signing certificate, base64) and WMM_SIGN_PASSWORD. Without them the setup is unsigned.
      - name: Build the setup and the winget manifests
        shell: pwsh
        env:
          WMM_SIGN_PFX_BASE64: ${{ secrets.WMM_SIGN_PFX_BASE64 }}
          WMM_SIGN_PASSWORD: ${{ secrets.WMM_SIGN_PASSWORD }}
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          if ($env:WMM_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "wmm-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WMM_SIGN_PFX_BASE64))
            $env:WMM_SIGN_PFX = $pfx
          }
          ./tools/build_installer.ps1 -Release release -BaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          Compress-Archive -Path release/winget/* -DestinationPath release/winget-manifests.zip
          # 2.11: the MSI for Group Policy and Intune (and for the updater of MSI installations), signed with the same certificate
          dotnet tool install --global wix --version 5.0.2
          ./tools/build_msi.ps1 -OutDir release
          $msi = Get-ChildItem release -Filter *.msi | Select-Object -First 1
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path release/SHA256SUMS.txt -Value "$hash  $($msi.Name)" -Encoding ascii
          if ($env:WMM_SIGN_PFX) { Remove-Item $env:WMM_SIGN_PFX -Force }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The in-app updater downloads WindowsMaintenanceManager-<version>.zip by name; the other files are for people and winget.
          $files = @(Get-ChildItem release -Filter *.zip | ForEach-Object FullName) + @(Get-ChildItem release -Filter *-Setup-*.exe | ForEach-Object FullName) +
            @(Get-ChildItem release -Filter *.msi | ForEach-Object FullName)
          gh release create "${{ github.ref_name }}" $files release/SHA256SUMS.txt --title "Windows Maintenance Manager ${{ github.ref_name }}" --notes-file release/notes.md
